name: Sync Docs

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'manifest.json'
  schedule:
    - cron: '17 3 * * *' # 每天 UTC 03:17（可调）
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建所有站点（忽略 manifest 是否变化）'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sync upstream docs
        run: node src/index.js
        env:
          SKIP_REWRITE: 'true'
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' }}

      - name: Commit manifest (main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest unchanged"
          else
            git commit -m "chore: update manifest"
            git pull --rebase origin main
            git push
          fi

      - name: Deploy to gh-pages
        if: hashFiles('dist/**') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
